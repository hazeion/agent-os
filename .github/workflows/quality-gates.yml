name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-package:
    name: Python package and installed lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: requirements-native.lock

      - name: Install hash-locked build environment
        run: |
          python -m pip install --require-hashes -r requirements-native.lock
          python -m pip install --require-hashes -r requirements-quality.lock

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the packaged Node dashboard
        run: |
          npm --prefix web ci --ignore-scripts
          npm --prefix web run build
          python scripts/stage_web_runtime.py

      - name: Build and verify exact artifacts
        run: |
          python -m build --no-isolation --sdist --wheel --outdir dist
          python scripts/verify_python_artifacts.py dist

      - name: Exercise pipx installed lifecycle
        shell: bash
        run: |
          smoke_root="$RUNNER_TEMP/mentat-package-smoke"
          export PIPX_HOME="$smoke_root/pipx-home"
          export PIPX_BIN_DIR="$smoke_root/bin"
          python -m pipx install dist/*.whl
          "$PIPX_BIN_DIR/mentat" --version
          "$PIPX_BIN_DIR/mentat" setup --data-dir "$smoke_root/data" --port 8894
          "$PIPX_BIN_DIR/mentat" doctor --data-dir "$smoke_root/data" --port 8894
          launcher_pid=""
          cleanup_launcher_group() {
            if [ -z "$launcher_pid" ]; then
              return
            fi
            if kill -TERM -- "-$launcher_pid" 2>/dev/null; then
              sleep 1
              kill -KILL -- "-$launcher_pid" 2>/dev/null || true
            fi
            wait "$launcher_pid" 2>/dev/null || true
          }
          setsid "$PIPX_BIN_DIR/mentat" start --data-dir "$smoke_root/data" --port 8894 >"$RUNNER_TEMP/mentat-package.log" 2>&1 &
          launcher_pid=$!
          trap cleanup_launcher_group EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8894/api/bridge/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8894/api/bridge/health >/dev/null
          curl --fail --silent http://127.0.0.1:8894/ >/dev/null
          CHROME_PATH=/usr/bin/google-chrome \
            MENTAT_WEB_BASE_URL=http://127.0.0.1:8894 \
            MENTAT_WEB_BROWSER_DEBUG_PORT=9337 \
            MENTAT_WEB_BROWSER_RUNTIME_DIR="$RUNNER_TEMP/web-foundation-smoke-runtime" \
            node scripts/web_foundation_smoke.mjs
          stop_succeeded=true
          if ! "$PIPX_BIN_DIR/mentat" stop --data-dir "$smoke_root/data" --port 8894; then
            stop_succeeded=false
          fi
          launcher_exited=false
          for attempt in {1..75}; do
            if ! kill -0 "$launcher_pid" 2>/dev/null; then
              launcher_exited=true
              break
            fi
            sleep 0.2
          done
          if [ "$stop_succeeded" != true ] || [ "$launcher_exited" != true ]; then
            tail -c 8192 "$RUNNER_TEMP/mentat-package.log" >&2 || true
            cleanup_launcher_group
            launcher_pid=""
            if [ "$stop_succeeded" != true ]; then
              echo 'Installed Mentat stop command failed' >&2
            fi
            if [ "$launcher_exited" != true ]; then
              echo 'Installed Mentat launcher did not exit after stop' >&2
            fi
            exit 1
          fi
          wait "$launcher_pid" || true
          if curl --fail --silent http://127.0.0.1:8894/api/bridge/health >/dev/null; then
            echo 'Installed Mentat remained healthy after stop' >&2
            exit 1
          fi
          test -f "$smoke_root/data/tasks.json"
          trap - EXIT
          launcher_pid=""

      - name: Upload verified Python artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mentat-python-package
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  browser-smoke:
    name: Browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install pinned runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Run loopback browser smoke
        shell: bash
        env:
          CHROME_PATH: /usr/bin/google-chrome
          MENTAT_BASE_URL: http://127.0.0.1:8895
          MENTAT_BROWSER_DEBUG_PORT: "9335"
          MENTAT_BROWSER_RUNTIME_DIR: ${{ runner.temp }}/browser-smoke-runtime
        run: |
          export MENTAT_DATA_DIR="$RUNNER_TEMP/mentat-browser-data"
          python server.py --data-dir "$MENTAT_DATA_DIR" --port 8895 >"$RUNNER_TEMP/mentat-browser.log" 2>&1 &
          server_pid=$!
          cleanup() {
            python -m mentat stop --data-dir "$MENTAT_DATA_DIR" --port 8895 >/dev/null 2>&1 || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8895/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8895/api/health >/dev/null
          node scripts/browser_smoke.mjs
          git diff --exit-code -- data/agents.json

  web-foundation:
    name: Node runtime foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the frozen web dependency tree
        run: npm --prefix web ci --ignore-scripts

      - name: Install pinned Python runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Install pinned Chrome for Testing
        shell: bash
        env:
          CHROME_FOR_TESTING_VERSION: 152.0.7923.0
        run: |
          test "$(tr -d '\r\n' < .chrome-for-testing-version)" = "$CHROME_FOR_TESTING_VERSION"
          chrome_path="$(web/node_modules/.bin/browsers install "chrome@$CHROME_FOR_TESTING_VERSION" --path "$RUNNER_TEMP/chrome-for-testing" --format '{{path}}')"
          test -x "$chrome_path"
          echo "MENTAT_LIGHTHOUSE_CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Verify and build the production web foundation
        run: |
          npm --prefix web run check
          npm --prefix web run build
          npm --prefix web audit --audit-level=high
          python -m unittest tests.test_mentat_local_bridge tests.test_mentat_web_preview -v

      - name: Run the production Node and Python browser smoke
        shell: bash
        env:
          CHROME_PATH: /usr/bin/google-chrome
          MENTAT_WEB_BASE_URL: http://127.0.0.1:8896
          MENTAT_WEB_BROWSER_DEBUG_PORT: "9336"
          MENTAT_WEB_BROWSER_RUNTIME_DIR: ${{ runner.temp }}/web-foundation-smoke-runtime
          MENTAT_LIGHTHOUSE_FAILURE_PATH: ${{ runner.temp }}/mentat-lighthouse-failure.json
        run: |
          preview_data_dir="$RUNNER_TEMP/mentat-web-preview-data"
          bootstrap_port=8895
          preview_pid=""
          cleanup() {
            if test -n "$preview_pid"; then
              kill -TERM "$preview_pid" 2>/dev/null || true
              wait "$preview_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          timeout --preserve-status --signal=INT --kill-after=10s 10s env MENTAT_DATA_DIR="$preview_data_dir" python server.py --port "$bootstrap_port" >"$RUNNER_TEMP/mentat-web-bootstrap.log" 2>&1
          test -f "$preview_data_dir/private/console/mentat.sqlite3"
          MENTAT_DATA_DIR="$preview_data_dir" python scripts/mentat_web_preview.py --port 8896 >"$RUNNER_TEMP/mentat-web-preview.log" 2>&1 &
          preview_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8896/api/bridge/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8896/ >/dev/null
          curl --fail --silent http://127.0.0.1:8896/api/bridge/health >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Host: attacker.example' http://127.0.0.1:8896/)" = 403
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Origin: https://attacker.example' --header 'Sec-Fetch-Site: cross-site' http://127.0.0.1:8896/)" = 403
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Sec-Fetch-Site: bogus' http://127.0.0.1:8896/)" = 403
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Sec-Fetch-Site: cross-site, same-origin' http://127.0.0.1:8896/)" = 403
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Host: attacker.example' http://127.0.0.1:8896/_next/static/forged-host-probe.js)" = 403
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Host: attacker.example' http://127.0.0.1:8896/_next/image)" = 403
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Host: attacker.example' http://127.0.0.1:8896/favicon.ico)" = 403
          node scripts/web_foundation_smoke.mjs
          CHROME_PATH="$MENTAT_LIGHTHOUSE_CHROME_PATH" npm --prefix web run lighthouse:gate
          kill -TERM "$preview_pid"
          wait "$preview_pid"
          if curl --fail --silent http://127.0.0.1:8896/api/bridge/health >/dev/null; then
            echo 'Node foundation remained healthy after supervisor stop' >&2
            exit 1
          fi
          trap - EXIT
          python scripts/verify_web_preview_lifecycle.py

      - name: Upload bounded Lighthouse failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-foundation-lighthouse-failure
          path: ${{ runner.temp }}/mentat-lighthouse-failure.json
          if-no-files-found: ignore
          retention-days: 7

  security-scan:
    name: Dependency and secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: requirements-quality.lock

      - name: Install hash-locked audit tools
        run: python -m pip install --require-hashes -r requirements-quality.lock

      - name: Audit runtime and native dependencies
        run: |
          python -m pip_audit -r requirements.txt --strict --progress-spinner off
          python -m pip_audit -r requirements-native.lock --strict --progress-spinner off

      - name: Scan tracked files for new secret candidates
        run: python scripts/check_tracked_secrets.py

  required:
    name: Quality gates required
    if: ${{ always() }}
    needs:
      - python-package
      - browser-smoke
      - web-foundation
      - security-scan
    runs-on: ubuntu-24.04
    steps:
      - name: Verify quality gates
        env:
          PACKAGE_RESULT: ${{ needs.python-package.result }}
          BROWSER_RESULT: ${{ needs.browser-smoke.result }}
          WEB_RESULT: ${{ needs.web-foundation.result }}
          SECURITY_RESULT: ${{ needs.security-scan.result }}
        run: |
          test "$PACKAGE_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$WEB_RESULT" = success
          test "$SECURITY_RESULT" = success
